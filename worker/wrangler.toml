name = "memory-shelf-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "memory-shelf"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "memory-shelf-media"

[vars]
# Override in `wrangler secret put AUTH_SECRET` for production —
# never commit a real secret to this file.
AUTH_SECRET = "development-only-change-me"

# Pages/Workers combo: deploy the Vite build as a Cloudflare Pages project
# and point VITE_API_BASE_URL (Pages build env var) at this Worker's URL,
# e.g. https://memory-shelf-api.<your-subdomain>.workers.dev
