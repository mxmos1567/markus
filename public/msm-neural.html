<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MSM Neural — Projektnetzwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B12;
    --line:#1B2637;
    --text:#DCE6F2;
    --text-dim:#7C8CA3;
    --copper:#C98A4B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    /* Keine Text-/Element-Markierung beim Ziehen oder langen Drücken
       (verhindert den hängenbleibenden "blauen" Markier-Hintergrund). */
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  /* Eingaben (Suche) dürfen weiterhin markierbar sein */
  input,textarea{-webkit-user-select:text;user-select:text}
  canvas{display:block;position:fixed;inset:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas.dragging{cursor:grabbing}

  header{
    position:fixed;top:0;left:0;right:0;
    padding:18px 22px 0;
    pointer-events:none;z-index:10;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  }
  .brand h1{
    font-family:'Chakra Petch',sans-serif;
    font-size:clamp(1.15rem,2.6vw,1.6rem);
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  .brand h1 span{color:var(--copper)}
  .brand p{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;color:var(--text-dim);
    margin-top:4px;letter-spacing:.06em;
  }
  .stats{
    font-family:'IBM Plex Mono',monospace;
    font-size:.66rem;color:var(--text-dim);
    text-align:right;line-height:1.7;letter-spacing:.05em;white-space:nowrap;
  }
  .stats b{color:var(--copper);font-weight:500}

  nav{
    position:fixed;left:22px;bottom:20px;z-index:10;
    display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 44px);
    align-items:center;
  }
  .chip{
    pointer-events:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:.66rem;letter-spacing:.05em;
    padding:7px 11px;
    background:rgba(13,20,32,.85);
    border:1px solid var(--line);border-radius:2px;
    color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;gap:7px;
    transition:border-color .2s,color .2s,opacity .2s;
    backdrop-filter:blur(6px);
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .chip .dot.dashed{background:none;border:1.5px dashed var(--c)}
  .chip.active{color:var(--text);border-color:var(--c)}
  .chip.muted{opacity:.35}
  .chip:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .chip.util{border-style:dashed}

  .chip-select,.search-input{
    pointer-events:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:.66rem;letter-spacing:.04em;
    padding:7px 10px;
    background:rgba(13,20,32,.85);
    border:1px solid var(--line);border-radius:2px;
    color:var(--text-dim);
    backdrop-filter:blur(6px);
  }
  .chip-select:focus-visible,.search-input:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .search-input{color:var(--text);width:128px}
  .search-input::placeholder{color:var(--text-dim)}
  .search-input:focus{outline:none;border-color:var(--copper)}

  .hint{
    position:fixed;right:22px;bottom:20px;z-index:9;
    font-family:'IBM Plex Mono',monospace;
    font-size:.62rem;color:var(--text-dim);letter-spacing:.05em;
    text-align:right;line-height:1.8;
  }

  aside{
    position:fixed;top:0;right:0;bottom:0;
    width:min(380px,92vw);
    background:linear-gradient(180deg,rgba(13,20,32,.97),rgba(9,13,21,.97));
    border-left:1px solid var(--line);
    z-index:20;transform:translateX(105%);
    transition:transform .32s cubic-bezier(.22,.9,.3,1);
    padding:26px 24px;overflow-y:auto;backdrop-filter:blur(10px);
  }
  aside.open{transform:translateX(0)}
  aside .close{
    position:absolute;top:16px;right:16px;
    background:none;border:1px solid var(--line);
    color:var(--text-dim);width:30px;height:30px;
    border-radius:2px;cursor:pointer;font-size:.9rem;
    font-family:'IBM Plex Mono',monospace;
    transition:border-color .2s,color .2s;
  }
  aside .close:hover{border-color:var(--copper);color:var(--text)}
  aside .close:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .cat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--pc,var(--copper));
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .cat-label::before{content:'';width:16px;height:1px;background:var(--pc,var(--copper))}
  .cat-label .status{
    color:var(--text-dim);border:1px dashed var(--text-dim);
    padding:1px 6px;border-radius:2px;font-size:.58rem;
  }
  aside h2{
    font-family:'Chakra Petch',sans-serif;
    font-size:1.35rem;font-weight:600;
    margin:10px 0 6px;line-height:1.25;
  }
  aside .subtitle{font-size:.82rem;font-style:italic;color:var(--text-dim);margin-bottom:12px;line-height:1.5}
  aside .desc{font-size:.86rem;line-height:1.65;color:#B8C4D6;margin-bottom:14px}
  .meta-line{
    font-size:.78rem;color:var(--text-dim);margin-bottom:6px;
    display:flex;gap:6px;flex-wrap:wrap;line-height:1.5;
  }
  .meta-line b{color:var(--text);font-weight:500}
  .sec-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);margin:20px 0 10px;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:.64rem;
    padding:4px 8px;border:1px solid var(--line);border-radius:2px;
    color:var(--text-dim);
  }
  .action-row{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
  .action-btn{
    flex:1;min-width:130px;
    font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.03em;
    padding:10px 12px;border-radius:2px;text-align:center;cursor:pointer;
    border:1px solid var(--copper);color:var(--copper);background:rgba(201,138,75,.08);
    transition:background .2s,opacity .2s;
  }
  .action-btn:hover:not(.disabled){background:rgba(201,138,75,.18)}
  .action-btn.disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--text-dim);background:none}
  .action-btn:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .ext-links{display:flex;flex-direction:column;gap:6px}
  .ext-link{
    font-size:.78rem;color:var(--copper);text-decoration:none;
    border:1px solid var(--line);border-radius:2px;padding:8px 10px;display:block;
    transition:border-color .2s;word-break:break-word;
  }
  .ext-link:hover{border-color:var(--copper)}
  .links{display:flex;flex-direction:column;gap:6px}
  .link-node{
    font-size:.78rem;padding:8px 10px;
    border:1px solid var(--line);border-radius:2px;
    background:rgba(255,255,255,.02);
    cursor:pointer;color:var(--text);
    display:flex;align-items:center;gap:9px;
    transition:border-color .2s;
    text-align:left;font-family:inherit;width:100%;
  }
  .link-node:hover{border-color:var(--lc,var(--copper))}
  .link-node:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .link-node .dot{width:6px;height:6px;border-radius:50%;background:var(--lc,var(--copper));flex-shrink:0}
  .rel-tag{
    font-family:'IBM Plex Mono',monospace;font-size:.54rem;letter-spacing:.04em;
    text-transform:uppercase;color:var(--text-dim);
    border:1px solid var(--line);border-radius:2px;padding:1px 5px;flex-shrink:0;
  }

  @media (max-width:640px){
    .stats{display:none}
    .hint{display:none}
    nav{bottom:14px;left:14px;max-width:calc(100% - 28px)}
    .chip{font-size:.6rem;padding:6px 9px}
    .search-input{width:104px}
  }
  @media (prefers-reduced-motion:reduce){
    aside{transition:none}
  }
</style>
</head>
<body>

<canvas id="net"></canvas>

<header>
  <div class="brand">
    <h1>MSM <span>Neural</span></h1>
    <p>Projektnetzwerk · Ideen &amp; Maschinen · Mitterdorf a. d. Raab</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<nav id="filters" aria-label="Kategoriefilter"></nav>
<div class="hint">
  Klicken = Details · Ziehen = Verschieben<br>
  Lange drücken = Verbindungen · Tippen = zurück<br>
  Doppelklick = Anpinnen · Scrollen = Zoom<br>
  Fläche ziehen = Karte bewegen
</div>

<aside id="panel" aria-live="polite">
  <button class="close" id="closeBtn" aria-label="Detailansicht schließen">✕</button>
  <div class="cat-label">
    <span id="pCat"></span>
    <span class="status" id="pType" style="border-style:solid"></span>
    <span class="status" id="pStatus" hidden></span>
  </div>
  <h2 id="pTitle"></h2>
  <p class="subtitle" id="pSubtitle" hidden></p>
  <p class="desc" id="pDesc"></p>

  <div id="pMeta"></div>

  <div class="sec-title">Technik &amp; Werkzeuge</div>
  <div class="tags" id="pTags"></div>

  <div class="action-row">
    <button class="action-btn" id="btnIdea" type="button">Idee öffnen</button>
    <button class="action-btn" id="btnMemory" type="button">Erinnerung öffnen</button>
  </div>

  <div id="pExtLinksSection">
    <div class="sec-title">Links</div>
    <div class="ext-links" id="pExtLinks"></div>
  </div>

  <div class="sec-title">Verbunden mit</div>
  <div class="links" id="pLinks"></div>
</aside>

<script>
/* =========================================================================
   MSM NEURAL — zentrale Datenstruktur
   -------------------------------------------------------------------------
   Jeder Eintrag unten ist die EINZIGE Stelle, die künftig erweitert werden
   muss. Nodes, Kanten, Panel-Inhalte, Filter und Suche entstehen automatisch
   daraus — siehe buildGraph() weiter unten.

   Felder pro Node:
     id, title, category, type, status,
     shortDescription, longDescription,
     origin, parent, related, memories, ideas,
     images, links, qrTarget, shelfCompartment, createdApprox, tags

   - origin:  Freitext ("aus einem Gespräch") ODER die id eines anderen
              Nodes ("mesh"). Löst es sich zu einer echten id auf, wird
              automatisch eine "stammt aus"-Verbindung gezeichnet.
     parent:  NUR setzen, wenn es wirklich ein Unterprojekt ist (id eines
              anderen Nodes). Im Zweifel stattdessen `related` verwenden.
     related: Array von Node-ids — verwandt, aber kein Unterprojekt.
     memories:Array von Node-ids vom Typ 'erinnerung', die zu diesem
              Projekt gehören (z. B. Fächer aus dem Erinnerungsregal).
     ideas:   Array von Node-ids vom Typ 'idee', die aus diesem Projekt
              entstanden sind.

   type:   'projekt' | 'idee' | 'erinnerung' | 'objekt'
   status: 'aktiv' | 'abgeschlossen' | 'idee' | 'verworfen'
   ========================================================================= */

  hub:      {name:'Zentrum',              color:'#EDE3D0'},
  hw:       {name:'Hardware & Embedded',  color:'#E8A54B'},
  sw:       {name:'Software',             color:'#4FC3E8'},
  pyro:     {name:'Pyrotechnik',          color:'#F0654A'},
  write:    {name:'Schreiben',            color:'#B48CF2'},
  print:    {name:'3D-Druck',             color:'#7ED491'},
  ki:       {name:'KI-Projekte',          color:'#E87BC0'},
  idea:     {name:'Ideen & Visionen',     color:'#93A4BE'},
  memory:   {name:'Erinnerungen',         color:'#C9A24B'},
  machine:  {name:'Maschinen',            color:'#6C8CFF'},
  workshop: {name:'Werkstatt',            color:'#A9A56B'},
  person:   {name:'Personen',             color:'#E0A9B0'}
};

/* Fallback, falls in den Daten eine unbekannte Kategorie auftaucht — so
   stürzt die Seite nie ab, sondern zeigt den Knoten neutral grau an. */
function catOf(id){ return CATS[id] || {name:id, color:'#8A93A6'}; }

const TYPE_LABELS = {
  projekt:    'Projekt',
  idee:       'Idee / Vision',
  erinnerung: 'Erinnerung',
  objekt:     'Objekt',
  modul:      'Modul',
  person:     'Person'
};

const STATUS_LABELS = {
  aktiv:        'Aktiv',
  abgeschlossen:'Abgeschlossen',
  idee:         'Idee / Konzept',
  verworfen:    'Verworfen',
  pausiert:     'Pausiert'

/* =========================================================================
   Automatischer Graphenaufbau
   -------------------------------------------------------------------------
   Aus origin / parent / related / memories / ideas werden hier automatisch
   Nodes-Referenzen und Kanten erzeugt. Wird ein zweiter Ort für dieselbe
   Verbindung angegeben (z. B. weil zwei Nodes sich gegenseitig referenzieren),
   gewinnt die strukturell genauere Kantenart (siehe TYPE_PRIORITY).
   ========================================================================= */
const TYPE_PRIORITY = {parent:4, memory:3, idea:3, origin:2, related:1};

const REL_LABELS = {
  parent:  {forward:'Übergeordnet',  backward:'Unterprojekt'},
  origin:  {forward:'Stammt aus',    backward:'Ursprung von'},
  memory:  {forward:'Erinnerung',    backward:'Gehört zu'},
  idea:    {forward:'Idee daraus',   backward:'Ursprungsprojekt'},
  related: {forward:'Verwandt',      backward:'Verwandt'}
};

function buildGraph(data){
  const byId = Object.fromEntries(data.map(n=>[n.id,n]));

  const nodes = data.map(n=>({
    ...n,
    cat: n.category,
    label: n.title,
    desc: n.shortDescription || n.longDescription || '',
    tags: n.tags || [],
    size: n.size || 9,
    x:0, y:0, vx:0, vy:0, fixed:false, pinned:false,
    phase: Math.random()*Math.PI*2
  }));
  const nById = Object.fromEntries(nodes.map(n=>[n.id,n]));

  const edgeMap = new Map();
  function addEdge(aId, bId, type){
    const a = nById[aId], b = nById[bId];
    if(!a || !b || a===b) return;
    const key = [a.id,b.id].sort().join('|');
    const existing = edgeMap.get(key);
    if(!existing || TYPE_PRIORITY[type] > TYPE_PRIORITY[existing.type]){
      edgeMap.set(key, {a,b,type});
    }
  }

  nodes.forEach(n=>{
    if(n.parent) addEdge(n.id, n.parent, 'parent');
    if(n.origin && nById[n.origin]) addEdge(n.id, n.origin, 'origin');
    (n.related||[]).forEach(r=>addEdge(n.id, r, 'related'));
    (n.memories||[]).forEach(m=>addEdge(n.id, m, 'memory'));
    (n.ideas||[]).forEach(i=>addEdge(n.id, i, 'idea'));
  });

  const edges = [...edgeMap.values()];

  const neighborIds = {};
  const edgesByNode = {};
  nodes.forEach(n=>{ neighborIds[n.id]=new Set(); edgesByNode[n.id]=[]; });
  edges.forEach(e=>{
    neighborIds[e.a.id].add(e.b.id);
    neighborIds[e.b.id].add(e.a.id);
    edgesByNode[e.a.id].push({other:e.b, edge:e});
    edgesByNode[e.b.id].push({other:e.a, edge:e});
  });

  return {nodes, byId:nById, edges, neighborIds, edgesByNode};
}

function relLabel(edge, viewFromId){
  const dir = edge.a.id === viewFromId ? 'forward' : 'backward';
  return REL_LABELS[edge.type][dir];
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function slugifyCompartment(c){
  return String(c).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function ideaHref(n){
  return (n.type==='idee' || n.type==='projekt') && n.qrTarget ? n.qrTarget : null;
}
function memoryHref(n){
  const isMemoryish = n.type==='erinnerung' || n.type==='objekt' || !!n.shelfCompartment;
  if(n.qrTarget && isMemoryish) return n.qrTarget;
  if(n.shelfCompartment) return `memory/fach-${slugifyCompartment(n.shelfCompartment)}.html`;
  return null;
}

/* Aktuelle Datenquelle + veränderbare Graph-Bindings.
   Werden von applyData() (weiter unten, nach resize()) befüllt und beim
   Nachladen einer JSON erneut gesetzt. */
let currentData = nodesData;
let NODES, byId, EDGES, neighborIds, edgesByNode;

/* ================= Setup ================= */
const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Ansicht: Pan & Zoom */
const view = {x:0, y:0, k:1};
function toWorld(sx, sy){ return {x:(sx - view.x)/view.k, y:(sy - view.y)/view.k}; }

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

/* Knoten initialisieren — Cluster grob nach Kategorie platzieren */
const clusterAngle = {
  hub:0, hw:-2.4, sw:0.5, pyro:2.6, write:-0.7, print:1.6, ki:-1.4, idea:3.1,
  memory:2.0, machine:-3.0, workshop:-0.05
};

/* Baut Graph, Positionen und Suchindex aus einer nodesData-Liste auf.
   Erneut aufrufbar — so aktualisiert sich das Netz, wenn eine neue JSON
   geladen wird, ohne die Datei zu bearbeiten. */
function applyData(data){
  currentData = data;
  const graph = buildGraph(data);
  NODES = graph.nodes; byId = graph.byId; EDGES = graph.edges;
  neighborIds = graph.neighborIds; edgesByNode = graph.edgesByNode;

  NODES.forEach(n=>{
    if(n.id==='msm'){ n.x = W/2; n.y = H/2; }
    else{
      const a = (clusterAngle[n.cat] ?? 0) + (Math.random()-0.5)*1.1;
      const r = Math.min(W,H)*0.30 + Math.random()*140;
      n.x = W/2 + Math.cos(a)*r;
      n.y = H/2 + Math.sin(a)*r;
    }
    n.vx=0; n.vy=0; n.fixed=false; n.pinned=false;

    const relatedTitles = edgesByNode[n.id].map(({other})=>other.label);
    const originLabel = n.origin ? (byId[n.origin] ? byId[n.origin].label : n.origin) : '';
    n._searchText = [
      n.label, n.shortDescription, n.longDescription, originLabel,
      CATS[n.cat] && CATS[n.cat].name, TYPE_LABELS[n.type],
      ...(n.tags||[]), ...relatedTitles
    ].filter(Boolean).join(' ').toLowerCase();
  });
}

/* Startdaten: zuletzt geladene JSON aus localStorage, sonst eingebaute nodesData */
(function initData(){
  let data = nodesData;
  try{
    const saved = localStorage.getItem('msm-neural-data');
    if(saved){ const parsed = JSON.parse(saved); if(Array.isArray(parsed) && parsed.length) data = parsed; }
  }catch(e){/* localStorage evtl. nicht verfügbar (z. B. file://) — dann Standarddaten */}
  applyData(data);
})();

/* ================= Zustand ================= */
let activeCats = new Set(Object.keys(CATS));
let selected = null;
let hovered = null;
let dragNode = null, dragMoved = false;
let panning = false, panLast = null;
let lastClick = {id:null, t:0};
let searchMatchIds = null;
/* Lange drücken: dauerhaft alle direkten Verbindungen eines Punktes zeigen */
let linkFocus = null;
let longPressTimer = null, longPressFired = false;
/* Bewusst längeres Drücken nötig, damit es nicht schon beim normalen
   Klicken auslöst. */
const LONG_PRESS_MS = 650;
/* Erst ab dieser Fingerbewegung zählt es als Ziehen (sonst Tap/Long-Press).
   So bricht leichtes Wackeln beim Halten die Geste nicht ab. */
const DRAG_THRESHOLD = 8;
let downX = 0, downY = 0;

const VIEW_MODES = [
  {id:'all',           label:'Alle',                          test:()=>true},
  {id:'projekte',      label:'Nur Projekte',                  test:n=>n.type==='projekt'},
  {id:'erinnerungen',  label:'Nur Erinnerungen',              test:n=>n.type==='erinnerung' || n.type==='objekt'},
  {id:'ideen',         label:'Nur Ideen',                      test:n=>n.type==='idee'},
  {id:'aktiv',         label:'Nur aktive Projekte',            test:n=>n.type==='projekt' && n.status==='aktiv'},
  {id:'abgeschlossen', label:'Nur abgeschlossene Projekte',    test:n=>n.type==='projekt' && n.status==='abgeschlossen'},
  {id:'nieUmgesetzt',  label:'Nur nie umgesetzte Ideen',       test:n=>n.type==='idee' && n.status!=='verworfen'}
];
let currentViewMode = VIEW_MODES[0];

function nodeVisible(n){ return activeCats.has(n.cat) && currentViewMode.test(n); }
function edgeVisible(e){ return nodeVisible(e.a) && nodeVisible(e.b); }

/* ================= Impulse (feuernde Synapsen) ================= */
const pulses = [];
function spawnPulse(){
  const vis = EDGES.filter(edgeVisible);
  if(!vis.length) return;
  const e = vis[Math.floor(Math.random()*vis.length)];
  pulses.push({e, t:0, rev:Math.random()<0.5, speed:0.006+Math.random()*0.008});
}
if(!reduceMotion){ setInterval(spawnPulse, 350); }

/* ================= Physik ================= */
function step(){
  const cx=W/2, cy=H/2;
  for(let i=0;i<NODES.length;i++){
    const a=NODES[i];
    if(!nodeVisible(a)) continue;
    a.vx += (cx-a.x)*0.0005;
    a.vy += (cy-a.y)*0.0005;
    for(let j=i+1;j<NODES.length;j++){
      const b=NODES[j];
      if(!nodeVisible(b)) continue;
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy;
      if(d2<1) d2=1;
      if(d2<300*300){
        const d=Math.sqrt(d2);
        const f=2300/d2;
        const fx=dx/d*f, fy=dy/d*f;
        a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
      }
    }
  }
  EDGES.forEach(e=>{
    if(!edgeVisible(e)) return;
    const rest = (e.a.id==='msm'||e.b.id==='msm') ? 230 : 120 + (e.a.size+e.b.size)*1.5;
    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-rest)*0.0026;
    const fx=dx/d*f, fy=dy/d*f;
    e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy;
  });
  NODES.forEach(n=>{
    if(!nodeVisible(n)) return;
    if(n.fixed || n.pinned){ n.vx=0; n.vy=0; return; }
    n.vx*=0.86; n.vy*=0.86;
    n.x+=n.vx; n.y+=n.vy;
  });
}

/* ================= Zeichnen ================= */
let time=0;
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const EDGE_STYLES = {
  related: {color:'rgba(90,110,140,0.26)',  width:1,   dash:null},
  origin:  {color:'rgba(150,195,255,0.45)', width:1.2, dash:null},
  parent:  {color:e=>hexA(catOf(e.b.cat).color, 0.55), width:1.8, dash:null},
  memory:  {color:'rgba(201,162,75,0.55)',  width:1.1, dash:[2,3]},
  idea:    {color:'rgba(147,164,190,0.55)', width:1.1, dash:[6,3]}
};

function draw(){
  time+=0.016;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  /* dezentes Raster (mit der Karte mitbewegt) */
  ctx.strokeStyle='rgba(120,145,180,0.045)';
  ctx.lineWidth=1;
  const g=64*view.k;
  if(g>18){
    ctx.beginPath();
    for(let x=(view.x%g+g)%g; x<W; x+=g){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for(let y=(view.y%g+g)%g; y<H; y+=g){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
  }

  /* Welt-Transformation */
  ctx.setTransform(DPR*view.k, 0, 0, DPR*view.k, DPR*view.x, DPR*view.y);

  const focus = selected || hovered || linkFocus;
  const focusSet = focus ? new Set([focus.id, ...neighborIds[focus.id]]) : null;
  /* Bei dauerhaftem Fokus (Auswahl oder lange gedrückt) auch die Namen
     aller direkt verbundenen Punkte einblenden — nicht beim bloßen Hover. */
  const labelNeighbors = focus && focus !== hovered;

  /* Kanten */
  EDGES.forEach(e=>{
    if(!edgeVisible(e)) return;
    const inFocus = focusSet && (e.a.id===focus.id || e.b.id===focus.id);
    ctx.beginPath();
    ctx.moveTo(e.a.x,e.a.y);
    ctx.lineTo(e.b.x,e.b.y);
    ctx.setLineDash([]);
    if(inFocus){
      ctx.strokeStyle='rgba(201,138,75,0.75)';
      ctx.lineWidth=1.5/view.k;
    }else if(focusSet){
      ctx.strokeStyle='rgba(90,110,140,0.08)';
      ctx.lineWidth=1/view.k;
    }else{
      const style = EDGE_STYLES[e.type] || EDGE_STYLES.related;
      ctx.strokeStyle = typeof style.color==='function' ? style.color(e) : style.color;
      ctx.lineWidth = style.width/view.k;
      if(style.dash) ctx.setLineDash(style.dash.map(d=>d/view.k));
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });

  /* Impulse */
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];
    p.t+=p.speed;
    if(p.t>=1 || !edgeVisible(p.e)){ pulses.splice(i,1); continue; }
    const t=p.rev?1-p.t:p.t;
    const x=p.e.a.x+(p.e.b.x-p.e.a.x)*t;
    const y=p.e.a.y+(p.e.b.y-p.e.a.y)*t;
    const col=catOf((p.rev?p.e.a:p.e.b).cat).color;
    const glow=ctx.createRadialGradient(x,y,0,x,y,9);
    glow.addColorStop(0,col);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2); ctx.fill();
  }

  /* Knoten */
  NODES.forEach(n=>{
    if(!nodeVisible(n)) return;
    const col=catOf(n.cat).color;
    const isFocus = focus && n.id===focus.id;
    const passesFocus = !focusSet || focusSet.has(n.id);
    const passesSearch = !searchMatchIds || searchMatchIds.has(n.id);
    const inFocus = passesFocus && passesSearch;
    const alpha = inFocus ? 1 : (passesSearch ? 0.22 : 0.08);
    const pulse = reduceMotion ? 0 : Math.sin(time*1.6+n.phase)*1.4;
    const r = n.size + (isFocus?3:0) + pulse*0.4;

    /* Halo */
    const halo=ctx.createRadialGradient(n.x,n.y,r*0.4,n.x,n.y,r*2.4);
    halo.addColorStop(0, hexA(col, 0.28*alpha));
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(n.x,n.y,r*2.4,0,Math.PI*2); ctx.fill();

    /* Kern */
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#0A0F18';
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=(isFocus?2.2:1.4)/Math.max(view.k,0.6);
    ctx.strokeStyle=col;
    if(n.status==='idee' || n.status==='verworfen'){ ctx.setLineDash(n.status==='verworfen' ? [1.5,3] : [4,4]); }
    ctx.stroke();
    ctx.setLineDash([]);

    /* Pin-Ring */
    if(n.pinned){
      ctx.lineWidth=1/Math.max(view.k,0.6);
      ctx.strokeStyle='rgba(237,227,208,0.7)';
      ctx.beginPath(); ctx.arc(n.x,n.y,r+4,0,Math.PI*2); ctx.stroke();
    }

    ctx.fillStyle=hexA(col, n.id==='msm'?0.9:(n.status==='idee'?0.35:0.55));
    ctx.beginPath(); ctx.arc(n.x,n.y,r*0.38,0,Math.PI*2); ctx.fill();

    /* Beschriftung — kleine Labels bei starkem Rauszoomen ausblenden */
    const showLabel = isFocus || view.k > 0.55 || n.size >= 13 || (labelNeighbors && focusSet.has(n.id));
    if(showLabel){
      ctx.font=(n.id==='msm'?'600 13px':'500 11px')+" 'IBM Plex Mono',monospace";
      ctx.textAlign='center';
      ctx.fillStyle= inFocus ? 'rgba(220,230,242,0.92)' : 'rgba(220,230,242,0.25)';
      ctx.fillText(n.label, n.x, n.y+r+15);
    }
    ctx.globalAlpha=1;
  });

  step();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ================= Interaktion ================= */
function nodeAt(wx,wy){
  for(let i=NODES.length-1;i>=0;i--){
    const n=NODES[i];
    if(!nodeVisible(n)) continue;
    const dx=wx-n.x, dy=wy-n.y;
    const hit=(n.size+9);
    if(dx*dx+dy*dy < hit*hit) return n;
  }
  return null;
}

const pointers = new Map();
let pinchStart = null;

/* Kein Kontextmenü / keine Textmarkierung beim langen Drücken */
canvas.addEventListener('contextmenu', ev=>ev.preventDefault());

function clearSelection(){
  const sel = window.getSelection && window.getSelection();
  if(sel && sel.rangeCount) sel.removeAllRanges();
}

canvas.addEventListener('pointerdown', ev=>{
  ev.preventDefault();
  clearSelection();
  canvas.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

  if(pointers.size===2){
    /* Pinch beginnt — Drag/Pan abbrechen */
    clearTimeout(longPressTimer);
    if(dragNode){ dragNode.fixed=false; dragNode=null; }
    panning=false;
    const [p1,p2]=[...pointers.values()];
    pinchStart={
      d:Math.hypot(p2.x-p1.x,p2.y-p1.y),
      k:view.k,
      mid:{x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2},
      vx:view.x, vy:view.y
    };
    return;
  }

  downX=ev.clientX; downY=ev.clientY;
  const w=toWorld(ev.clientX, ev.clientY);
  const n=nodeAt(w.x,w.y);
  if(n){
    dragNode=n; dragMoved=false; n.fixed=true;
    canvas.classList.add('dragging');
    /* Lange drücken (ohne wirklich zu ziehen) → Verbindungen dieses Punktes zeigen */
    longPressFired=false;
    clearTimeout(longPressTimer);
    longPressTimer=setTimeout(()=>{
      if(dragNode===n && !dragMoved){ longPressFired=true; toggleLinkFocus(n); }
    }, LONG_PRESS_MS);
  }else{
    panning=true; dragMoved=false;
    panLast={x:ev.clientX,y:ev.clientY};
    canvas.classList.add('dragging');
  }
});

canvas.addEventListener('pointermove', ev=>{
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});

  if(pinchStart && pointers.size===2){
    const [p1,p2]=[...pointers.values()];
    const d=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
    const k=Math.max(0.3,Math.min(3,pinchStart.k*d/pinchStart.d));
    /* um Pinch-Mittelpunkt zoomen */
    const wx=(pinchStart.mid.x-pinchStart.vx)/pinchStart.k;
    const wy=(pinchStart.mid.y-pinchStart.vy)/pinchStart.k;
    view.k=k;
    view.x=mid.x-wx*k;
    view.y=mid.y-wy*k;
    return;
  }

  if(dragNode){
    /* Erst ab der Schwelle als Ziehen behandeln — kleines Wackeln beim
       Halten bewegt den Punkt nicht und bricht den Long-Press nicht ab. */
    if(!dragMoved && Math.hypot(ev.clientX-downX, ev.clientY-downY) <= DRAG_THRESHOLD) return;
    if(!dragMoved){ clearTimeout(longPressTimer); dragMoved=true; }
    const w=toWorld(ev.clientX, ev.clientY);
    dragNode.x=w.x; dragNode.y=w.y;
  }else if(panning && panLast){
    view.x += ev.clientX-panLast.x;
    view.y += ev.clientY-panLast.y;
    if(Math.hypot(ev.clientX-downX, ev.clientY-downY) > DRAG_THRESHOLD) dragMoved=true;
    panLast={x:ev.clientX,y:ev.clientY};
  }else{
    const w=toWorld(ev.clientX, ev.clientY);
    hovered=nodeAt(w.x,w.y);
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
  }
});

function endPointer(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size<2) pinchStart=null;
  clearSelection();

  if(dragNode){
    const n=dragNode;
    n.fixed=false;
    dragNode=null;
    clearTimeout(longPressTimer);
    canvas.classList.remove('dragging');
    if(longPressFired){
      /* War der Long-Press, der die Verbindungsansicht gerade eingeschaltet hat */
      longPressFired=false;
    }else if(!dragMoved){
      if(linkFocus){
        /* Verbindungsansicht aktiv → jeder kurze Klick beendet sie sofort */
        linkFocus=null; closePanel();
      }else{
        const now=performance.now();
        if(lastClick.id===n.id && now-lastClick.t<350){
          /* Doppelklick: anpinnen / lösen */
          n.pinned=!n.pinned;
          lastClick={id:null,t:0};
        }else{
          lastClick={id:n.id,t:now};
        }
        selectNode(n);
      }
    }
  }else if(panning){
    panning=false; panLast=null;
    canvas.classList.remove('dragging');
    if(!dragMoved){ closePanel(); linkFocus=null; }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* Maus-Zoom */
canvas.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const k=Math.max(0.3,Math.min(3, view.k*Math.exp(-ev.deltaY*0.0012)));
  const wx=(ev.clientX-view.x)/view.k;
  const wy=(ev.clientY-view.y)/view.k;
  view.k=k;
  view.x=ev.clientX-wx*k;
  view.y=ev.clientY-wy*k;
},{passive:false});

/* ================= Panel ================= */
const panel=document.getElementById('panel');

function configureActionButton(btn, target, label){
  btn.textContent = target ? label : 'Noch keine Detailseite';
  if(target){
    btn.classList.remove('disabled');
    btn.onclick = ()=> window.open(target, '_blank', 'noopener');
  }else{
    btn.classList.add('disabled');
    btn.onclick = null;
  }
}

function selectNode(n){
  selected=n;
  const col=catOf(n.cat).color;
  panel.style.setProperty('--pc',col);

  document.getElementById('pCat').textContent=catOf(n.cat).name;

  const typeEl=document.getElementById('pType');
  const typeLabel=TYPE_LABELS[n.type];
  typeEl.hidden=!typeLabel;
  typeEl.textContent=typeLabel||'';

  const statusEl=document.getElementById('pStatus');
  const statusLabel=STATUS_LABELS[n.status];
  statusEl.hidden=!statusLabel;
  statusEl.textContent=statusLabel||'';

  document.getElementById('pTitle').textContent=n.label;

  const subEl=document.getElementById('pSubtitle');
  const hasBoth = n.shortDescription && n.longDescription && n.shortDescription!==n.longDescription;
  subEl.hidden=!hasBoth;
  subEl.textContent=hasBoth?n.shortDescription:'';
  document.getElementById('pDesc').textContent = n.longDescription || n.shortDescription || '';

  /* Meta: Herkunft / Übergeordnet / Zeitraum */
  const meta=document.getElementById('pMeta');
  meta.innerHTML='';
  if(n.origin){
    const originNode = byId[n.origin];
    const line=document.createElement('div'); line.className='meta-line';
    line.innerHTML=`Herkunft: <b>${esc(originNode?originNode.label:n.origin)}</b>`;
    meta.appendChild(line);
  }
  if(n.parent && byId[n.parent]){
    const line=document.createElement('div'); line.className='meta-line';
    line.innerHTML=`Übergeordnet: <b>${esc(byId[n.parent].label)}</b>`;
    meta.appendChild(line);
  }
  if(n.createdApprox){
    const line=document.createElement('div'); line.className='meta-line';
    line.innerHTML=`Zeitraum: <b>${esc(n.createdApprox)}</b>`;
    meta.appendChild(line);
  }
  if(n.shelfCompartment){
    const line=document.createElement('div'); line.className='meta-line';
    line.innerHTML=`Regalfach: <b>${esc(n.shelfCompartment)}</b>`;
    meta.appendChild(line);
  }

  /* Tags */
  const tags=document.getElementById('pTags');
  tags.innerHTML='';
  n.tags.forEach(t=>{
    const el=document.createElement('span');
    el.className='tag'; el.textContent=t; tags.appendChild(el);
  });

  /* Aktionen */
  configureActionButton(document.getElementById('btnIdea'), ideaHref(n), 'Idee öffnen');
  configureActionButton(document.getElementById('btnMemory'), memoryHref(n), 'Erinnerung öffnen');

  /* Externe Links */
  const extSection=document.getElementById('pExtLinksSection');
  const extWrap=document.getElementById('pExtLinks');
  extWrap.innerHTML='';
  const links=n.links||[];
  extSection.hidden = links.length===0;
  links.forEach(l=>{
    const url = typeof l==='string' ? l : l.url;
    const label = typeof l==='string' ? l : (l.label||l.url);
    const a=document.createElement('a');
    a.className='ext-link'; a.href=url; a.target='_blank'; a.rel='noopener';
    a.textContent=label;
    extWrap.appendChild(a);
  });

  /* Verbunden mit */
  const linksWrap=document.getElementById('pLinks');
  linksWrap.innerHTML='';
  edgesByNode[n.id]
    .filter(({other})=>nodeVisible(other))
    .forEach(({other,edge})=>{
      const btn=document.createElement('button');
      btn.className='link-node';
      btn.style.setProperty('--lc',catOf(other.cat).color);
      btn.innerHTML=`<span class="dot"></span><span class="rel-tag">${esc(relLabel(edge,n.id))}</span> ${esc(other.label)}`;
      btn.addEventListener('click',()=>selectNode(other));
      linksWrap.appendChild(btn);
    });

  panel.classList.add('open');
}
function closePanel(){ selected=null; panel.classList.remove('open'); }

/* Lange drücken schaltet die Verbindungsansicht eines Punktes an/aus.
   Das Panel wird dabei geschlossen, damit die Karte frei sichtbar ist. */
function toggleLinkFocus(node){
  if(linkFocus===node){ linkFocus=null; return; }
  linkFocus=node;
  selected=null;
  panel.classList.remove('open');
}

document.getElementById('closeBtn').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePanel(); linkFocus=null; } });

/* ================= Filter, Ansicht & Suche ================= */
const nav=document.getElementById('filters');

const viewSelect=document.createElement('select');
viewSelect.className='chip-select';
viewSelect.setAttribute('aria-label','Ansicht');
VIEW_MODES.forEach(v=>{
  const opt=document.createElement('option');
  opt.value=v.id; opt.textContent=v.label;
  viewSelect.appendChild(opt);
});
viewSelect.addEventListener('change',()=>{
  currentViewMode = VIEW_MODES.find(v=>v.id===viewSelect.value) || VIEW_MODES[0];
  if(selected && !nodeVisible(selected)) closePanel();
  if(linkFocus && !nodeVisible(linkFocus)) linkFocus=null;
  updateStats();
});
nav.appendChild(viewSelect);

const searchInput=document.createElement('input');
searchInput.type='search';
searchInput.className='search-input';
searchInput.placeholder='Suche…';
searchInput.setAttribute('aria-label','Suche');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  searchMatchIds = q ? new Set(NODES.filter(n=>n._searchText.includes(q)).map(n=>n.id)) : null;
});
nav.appendChild(searchInput);

Object.entries(CATS).forEach(([key,c])=>{
  if(key==='hub') return;
  const btn=document.createElement('button');
  btn.className='chip active';
  btn.style.setProperty('--c',c.color);
  const dashed = (key==='ki'||key==='idea') ? ' dashed' : '';
  btn.innerHTML=`<span class="dot${dashed}"></span>${c.name}`;
  btn.addEventListener('click',()=>{
    if(activeCats.has(key)){ activeCats.delete(key); btn.classList.remove('active'); btn.classList.add('muted'); }
    else{ activeCats.add(key); btn.classList.add('active'); btn.classList.remove('muted'); }
    if(selected && !nodeVisible(selected)) closePanel();
    if(linkFocus && !nodeVisible(linkFocus)) linkFocus=null;
    updateStats();
  });
  nav.appendChild(btn);
});

/* Ansicht zurücksetzen */
const resetBtn=document.createElement('button');
resetBtn.className='chip util';
resetBtn.style.setProperty('--c','#C98A4B');
resetBtn.textContent='⟲ Ansicht';
resetBtn.addEventListener('click',()=>{ view.x=0; view.y=0; view.k=1; });
nav.appendChild(resetBtn);

/* ===== Daten laden / exportieren (befüllbare JSON) ===== */
function reloadWith(data){
  closePanel(); hovered=null; linkFocus=null; pulses.length=0;
  applyData(data);
  view.x=0; view.y=0; view.k=1;
  updateStats();
}

const loadLabel=document.createElement('label');
loadLabel.className='chip util'; loadLabel.style.cursor='pointer';
loadLabel.style.setProperty('--c','#C98A4B');
loadLabel.textContent='⭱ Daten laden';
const loadInput=document.createElement('input');
loadInput.type='file'; loadInput.accept='.json,application/json'; loadInput.style.display='none';
loadLabel.appendChild(loadInput);
loadInput.addEventListener('change', async ev=>{
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  try{
    const parsed = JSON.parse(await f.text());
    const data = Array.isArray(parsed) ? parsed : parsed.nodesData;
    if(!Array.isArray(data) || !data.length){ alert('Keine gültigen Knoten in der Datei gefunden.'); return; }
    reloadWith(data);
    try{ localStorage.setItem('msm-neural-data', JSON.stringify(data)); }catch(e){}
  }catch(err){ alert('JSON konnte nicht geladen werden:\n'+err.message); }
  ev.target.value='';
});
nav.appendChild(loadLabel);

const exportBtn=document.createElement('button');
exportBtn.className='chip util';
exportBtn.style.setProperty('--c','#C98A4B');
exportBtn.textContent='⭳ Export';
exportBtn.title='Aktuelle Daten als JSON-Vorlage herunterladen';
exportBtn.addEventListener('click', ()=>{
  const blob=new Blob([JSON.stringify(currentData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='msm-neural-data.json'; a.click();
  URL.revokeObjectURL(url);
});
nav.appendChild(exportBtn);

const resetDataBtn=document.createElement('button');
resetDataBtn.className='chip util';
resetDataBtn.textContent='⭮ Standarddaten';
resetDataBtn.title='Gespeicherte JSON verwerfen und die eingebauten Beispieldaten laden';
resetDataBtn.addEventListener('click', ()=>{
  try{ localStorage.removeItem('msm-neural-data'); }catch(e){}
  reloadWith(nodesData);
});
nav.appendChild(resetDataBtn);

/* ================= Statistik ================= */
function updateStats(){
  const vis=NODES.filter(nodeVisible);
  const edg=EDGES.filter(edgeVisible).length;
  const ideen=vis.filter(n=>n.status==='idee').length;
  document.getElementById('stats').innerHTML=
    `KNOTEN <b>${vis.length}</b> / ${NODES.length}<br>SYNAPSEN <b>${edg}</b> / ${EDGES.length}<br>DAVON IDEEN <b>${ideen}</b>`;
}
updateStats();
</script>
</body>
